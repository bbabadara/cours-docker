<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cours: Conteneurisation et Docker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Overlay (mobile) -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="#" class="logo">
                    <div class="logo-icon">🐳</div>
                    <div class="logo-text">
                        <h2>Docker & Conteneurisation</h2>
                        <span>Cours complet + TP</span>
                    </div>
                </a>
            </div>

            <nav class="sidebar-nav" id="sidebar-nav"></nav>

            <div class="sidebar-footer">
                <p>Badara : bbabadara@gmail.com</p>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <!-- Top Bar -->
            <header class="topbar">
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <div class="breadcrumb" id="breadcrumb">
                    <span>Fondamentaux</span> / <strong>Conteneurisation</strong>
                </div>

                <div class="topbar-actions">
                    <button class="btn-prev" id="btn-prev" disabled>
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                        <span class="btn-text">Précédent</span>
                    </button>
                    <button class="btn-next" id="btn-next">
                        <span class="btn-text">Suivant</span>
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </header>

            <!-- Content Area -->
            <main class="content-area">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 10%;"></div>
                </div>
                <div id="content-container"></div>
            </main>

            <!-- Footer -->
            <footer class="main-footer">
                <p>Cours sur la Conteneurisation et Docker &mdash; Badara &copy; 2024</p>
            </footer>
        </div>
    </div>

    <!-- Scroll to Top -->
    <button class="scroll-top" id="scroll-top" aria-label="Scroll to top">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
    </button>

    <!-- Modules (order matters) -->
    <script src="js/content.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
